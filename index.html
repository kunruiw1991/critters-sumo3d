<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Critter Sumo Bumpers 3D: Sky Ring Knockout!</title>
  <link rel="icon" href="icons/catnap.jpg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="webgl-canvas" aria-label="3D Sumo Bumper Arena"></canvas>

    <!-- Top HUD: Critter Picker, Ring & Fever Bars, Audio & Camera Toggles -->
    <header id="top-hud">
      <div id="left-picker-wrap">
        <button id="btn-mobile-picker" class="hud-circle-btn" aria-label="Choose Critter">
          <img id="mobile-picker-img" src="icons/catnap.jpg" alt="" />
          <span class="mini-paw-badge">🐾</span>
        </button>
        <div id="critter-picker" role="group" aria-label="Critter Picker"></div>
      </div>

      <div id="center-status">
        <div id="ring-timer-pill">
          <span class="hud-icon" id="stage-theme-icon">🌤️</span>
          <div id="ring-shrink-bar"><div id="ring-shrink-fill"></div></div>
          <span class="hud-icon" id="fever-badge">🌈</span>
          <div id="fever-bar"><div id="fever-fill"></div></div>
        </div>
      </div>

      <div id="top-right-controls">
        <button id="btn-open-grid" class="hud-circle-btn" aria-label="Critter Select Grid">🐾</button>
        <button id="btn-camera" class="hud-circle-btn" aria-label="Camera Angle">🎥</button>
        <button id="btn-sound" class="hud-circle-btn" aria-label="Sound Toggle">🔊</button>
      </div>
    </header>

    <!-- Stage Rail (8 Sky Rings) + Non-Overlapping Live Standings Row -->
    <div id="sub-hud-stack">
      <nav id="stage-rail" aria-label="Sky Ring Stages"></nav>
      <div id="live-standings" aria-label="Live Arena Standings"></div>
    </div>

    <!-- Bottom Cockpit: Giant Kid-Friendly Steering Pad + 3 Icon-Only Power Pedals -->
    <footer id="bottom-cockpit">
      <div id="steer-cluster" aria-label="Steering Controls">
        <button class="steer-btn" id="steer-up" data-dir="up" aria-label="Steer Up">⬆️</button>
        <div class="steer-row">
          <button class="steer-btn" id="steer-left" data-dir="left" aria-label="Steer Left">⬅️</button>
          <div id="player-badge-mini">
            <img id="player-mini-img" src="icons/catnap.jpg" alt="" />
            <span id="player-rank-emoji">🥇</span>
          </div>
          <button class="steer-btn" id="steer-right" data-dir="right" aria-label="Steer Right">➡️</button>
        </div>
        <button class="steer-btn" id="steer-down" data-dir="down" aria-label="Steer Down">⬇️</button>
      </div>

      <div id="pedal-cluster" aria-label="Sumo Power Pedals">
        <button class="power-pedal" id="pedal-1" data-pedal="1" aria-label="Whirlwind Spin">
          <span class="pedal-emoji">🌪️</span>
          <div class="pedal-cd-bar"><div class="pedal-cd-fill" id="cd-fill-1"></div></div>
        </button>
        <button class="power-pedal pedal-primary" id="pedal-2" data-pedal="2" aria-label="Rocket Ram">
          <span class="pedal-emoji">⚡</span>
          <div class="pedal-cd-bar"><div class="pedal-cd-fill" id="cd-fill-2"></div></div>
        </button>
        <button class="power-pedal" id="pedal-3" data-pedal="3" aria-label="Belly Shockwave">
          <span class="pedal-emoji">💥</span>
          <div class="pedal-cd-bar"><div class="pedal-cd-fill" id="cd-fill-3"></div></div>
        </button>
      </div>
    </footer>

    <!-- Pre-Match / Critter Select 4x2 Overlay Modal (100% Zero-Text) -->
    <div id="critter-modal" role="dialog" aria-label="Select Your Smiling Critter">
      <div id="critter-modal-card">
        <div id="critter-modal-header">
          <span class="modal-icon-badge">🐾</span>
          <span class="modal-icon-badge" id="modal-stage-icon">🌤️</span>
          <span class="modal-icon-badge">🎪</span>
        </div>
        <div id="critter-grid" role="group" aria-label="8 Smiling Critters Grid"></div>
        <button id="btn-start-match" class="modal-action-btn primary-pulse" aria-label="Start Sumo Match">▶️</button>
      </div>
    </div>

    <!-- Podium / Result Modal (100% Zero-Text Icon Podium) -->
    <div id="podium-modal" class="hidden" role="dialog" aria-label="Round Podium">
      <div id="podium-card">
        <div id="podium-banner">🏆</div>
        <div id="podium-stars">⭐⭐⭐</div>
        <div id="podium-columns"></div>
        <div id="podium-actions">
          <button id="btn-podium-critter" class="modal-action-btn" aria-label="Change Critter">🐾</button>
          <button id="btn-retry" class="modal-action-btn" aria-label="Retry Ring">🔄</button>
          <button id="btn-next-stage" class="modal-action-btn primary-pulse" aria-label="Next Ring">▶️</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
